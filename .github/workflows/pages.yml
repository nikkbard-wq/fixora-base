name: Deploy FIXORA Architecture Portal

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild site from source bundle
        run: |
          mkdir -p _site
          base64 -d .site.tar.gz.b64 > /tmp/site.tar.gz
          tar -xzf /tmp/site.tar.gz -C _site
          test -f _site/index.html
          test -f _site/assets/app.js
          test -f _site/assets/styles.css

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy FIXORA Base

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build FIXORA Base website
        run: |
          python build.py
          test -f _site/index.html
          test -f _site/product.html
          test -f _site/purchasing.html
          test -f _site/inventory.html
          test -f _site/sales.html
          test -f _site/architecture.html
          test -f _site/extensions.html
          test -f _site/demo.html
          test -f _site/demo.css
          test -f _site/demo.js
          test -f _site/styles.css
          test -f _site/app.js
          test "$(find _site -maxdepth 1 -name '*.html' | wc -l)" -eq 8

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
